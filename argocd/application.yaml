apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iot-streaming-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/heeyeon-yang/iot-streaming-platform-manifests.git'
    targetRevision: HEAD
    path: base
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: iot-streaming
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
